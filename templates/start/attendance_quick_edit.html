{% extends "start/base.html" %}
{% block title %}Davomatni belgilash{% endblock %}

{% block content %}
<style>
    /* Asosiy konteynyer va kartochka stili */
    .attendance-card {
        max-width: 500px;
        margin: 40px auto;
        padding: 28px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        border: 1px solid #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Sarlavha qismi */
    .attendance-header {
        border-bottom: 1px solid #f3f4f6;
        padding-bottom: 16px;
        margin-bottom: 24px;
    }

    .attendance-header h1 {
        font-size: 1.35rem;
        font-weight: 700;
        color: #111827;
        margin: 0 0 6px 0;
        line-height: 1.3;
    }

    .attendance-header .date-badge {
        display: inline-block;
        font-size: 0.85rem;
        color: #4b5563;
        background-color: #f3f4f6;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 500;
    }

    /* Forma input va select elementlari */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
    }

    .form-control {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.95rem;
        color: #1f2937;
        background-color: #f9fafb;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-sizing: border-box;
        transition: all 0.2s ease-in-out;
    }

    .form-control:focus {
        outline: none;
        background-color: #ffffff;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Tugma stili */
    .btn-submit {
        width: 100%;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
        margin-top: 8px;
    }

    .btn-submit:hover {
        background-color: #1d4ed8;
    }

    .btn-submit:active {
        transform: scale(0.99);
    }

    /* Orqaga qaytish havolasi */
    .back-wrapper {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #f3f4f6;
        text-align: center;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #6b7280;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s ease;
    }

    .back-link:hover {
        color: #2563eb;
    }
</style>

<div class="attendance-card">
    <div class="attendance-header">
        <h1>{{ student.full_name }}</h1>
        <div class="date-badge">
            Sana: <strong>{{ selected_date|date:"d.m.Y" }}</strong>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_status">Holati</label>
            <select name="status" id="id_status" class="form-control">
                <option value="present" {% if attendance.status == "present" %}selected{% endif %}>Keldi</option>
                <option value="absent" {% if attendance.status == "absent" or not attendance %}selected{% endif %}>Sababsiz kelmadi</option>
                <option value="excused" {% if attendance.status == "excused" %}selected{% endif %}>Sababli kelmadi</option>
            </select>
        </div>

        <div class="form-group">
            <label for="id_note">Izoh</label>
            <input type="text" id="id_note" name="note" class="form-control" value="{{ attendance.note|default:'' }}" placeholder="Sababi (ixtiyoriy)">
        </div>

        <button type="submit" class="btn-submit">Saqlash</button>
    </form>

    <div class="back-wrapper">
        <a href="{% url 'attendance_report' tenant.category.slug tenant.id %}?date={{ selected_date|date:'Y-m-d' }}" class="back-link">
            &larr; Hisobotga qaytish
        </a>
    </div>
</div>
{% endblock %}
